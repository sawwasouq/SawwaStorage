  if(isNaN(amount) || amount<=0){ toast('المبلغ غير صحيح'); return; }
  EXPENSES.push({id:uid('exp'), category, title, amount, note, createdAt:Date.now()});
  await saveExpenses();
  closeModal();
  toast('تمت إضافة المصروف');
  render();
  logActivity('expense_add', `إضافة مصروف "${title}" بقيمة ${money(amount)} د.أ`, {category});
}

function deleteExpense(id){
  showConfirm('حذف هذا المصروف؟', async ()=>{
    const e = EXPENSES.find(x=>x.id===id);
    EXPENSES = EXPENSES.filter(e=>e.id!==id);
    await saveExpenses();
    render();
    logActivity('expense_delete', `حذف مصروف "${e ? e.title : id}"`, {expenseId:id});
  }, 'حذف');
}

// ---- capital ----
function openCapitalAdjustModal(){
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2>حركة رأس مال يدوية</h2>
      <div class="field">
        <label>نوع الحركة</label>
        <select id="capType" style="width:100%; padding:10px 12px; border-radius:8px; border:1.5px solid var(--line); font-family:inherit; font-size:14px; background:var(--card); color:var(--ink);">
          <option value="injection">إيداع (إضافة رأس مال)</option>
          <option value="withdrawal">سحب (من رأس المال)</option>
        </select>
      </div>
      <div class="field">
        <label>المبلغ (د.أ) *</label>
        <input type="number" min="0" step="0.01" id="capAmount" placeholder="0.00">
      </div>
      <div class="field">
        <label>ملاحظة (اختياري)</label>
        <input type="text" id="capNote" placeholder="مثال: دفعة إضافية من المالك">
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-block" onclick="saveCapitalAdjust()">حفظ</button>
      </div>
      <div style="margin-top:8px; text-align:center;"><button class="btn btn-ghost btn-sm" onclick="closeModal()">إلغاء</button></div>
    </div>
  </div>`;
}

async function saveCapitalAdjust(){
  const type = document.getElementById('capType').value;
  const amount = parseFloat(document.getElementById('capAmount').value || '0');
  const note = document.getElementById('capNote').value.trim();
  if(isNaN(amount) || amount<=0){ toast('المبلغ غير صحيح'); return; }
  if(type==='withdrawal' && amount > FINANCE.capitalBalance){
    showConfirm('المبلغ أكبر من رأس المال النقدي الحالي، رح يصير الرصيد سالب. أكمل؟', async ()=>{
      await commitCapitalAdjust(type, amount, note);
    }, 'أكمل');
    return;
  }
  await commitCapitalAdjust(type, amount, note);
}

async function commitCapitalAdjust(type, amount, note){
  FINANCE.capitalBalance += (type==='injection' ? amount : -amount);
  CAPITAL_LOG.push({id:uid('cap'), type, amount, note, createdAt:Date.now()});
  await saveFinanceConfig();
  await saveCapitalLog();
  closeModal();
  toast('تم تسجيل الحركة');
  render();
  logActivity('capital_adjust', `${type==='injection' ? 'إيداع' : 'سحب'} ${money(amount)} د.أ من رأس المال${note ? ' — '+note : ''}`, {type, amount});
}

// ---- partners ----
function openPartnerModal(partnerId){
  const p = partnerId ? PARTNERS.find(x=>x.id===partnerId) : null;
  const othersTotal = PARTNERS.reduce((s,x)=>s+x.sharePct,0) - (p ? p.sharePct : 0);
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2>${p ? 'تعديل شريك' : 'إضافة شريك'}</h2>
      <div class="field">
        <label>اسم الشريك *</label>
        <input type="text" id="ptName" value="${p ? escapeHtml(p.name) : ''}">
      </div>
      <div class="field">
        <label>نسبة حصته من "أرباح الشركاء" (%) *</label>
        <input type="number" min="0" max="100" step="0.1" id="ptShare" value="${p ? p.sharePct : ''}">
        <div class="fin-sub" style="margin-top:4px;">باقي الشركاء حاليًا مجموعهم: ${othersTotal}%</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-block" onclick="savePartnerForm(${p ? `'${p.id}'` : 'null'})">حفظ</button>
      </div>
      ${p ? `<div style="margin-top:10px;"><button class="btn btn-danger btn-block" onclick="deletePartner('${p.id}')">حذف الشريك</button></div>` : ''}
      <div style="margin-top:8px; text-align:center;"><button class="btn btn-ghost btn-sm" onclick="closeModal()">إلغاء</button></div>
    </div>
  </div>`;
}

async function savePartnerForm(partnerId){
  const name = document.getElementById('ptName').value.trim();
  const sharePct = parseFloat(document.getElementById('ptShare').value || '0');
  if(!name){ toast('اكتب اسم الشريك'); return; }
  if(isNaN(sharePct) || sharePct<0 || sharePct>100){ toast('النسبة غير صحيحة'); return; }
  const isNew = !partnerId;
  if(partnerId){
    const p = PARTNERS.find(x=>x.id===partnerId);
    p.name=name; p.sharePct=sharePct;
  } else {
    PARTNERS.push({id:uid('ptn'), name, sharePct, dueBalance:0});
  }
  const total = PARTNERS.reduce((s,p)=>s+p.sharePct,0);
  await savePartners();
  closeModal();
  if(Math.round(total)!==100) toast(`تنبيه: مجموع نسب الشركاء الآن ${total}% (المفروض يكون 100%)`);
  else toast('تم الحفظ');
  render();
  logActivity(isNew ? 'partner_add' : 'partner_edit', `${isNew ? 'إضافة شريك جديد' : 'تعديل بيانات الشريك'} "${name}" (${sharePct}%)`, {partnerId});
}

function deletePartner(id){
  if(PARTNERS.length<=1){ toast('لازم يبقى شريك واحد على الأقل'); return; }
  showConfirm('حذف هذا الشريك؟', async ()=>{
    const p = PARTNERS.find(x=>x.id===id);
    PARTNERS = PARTNERS.filter(p=>p.id!==id);
    await savePartners();
    render();
    logActivity('partner_delete', `حذف الشريك "${p ? p.name : id}"`, {partnerId:id});
  }, 'حذف الشريك');
}

function openPartnerPayoutModal(partnerId){
  const p = PARTNERS.find(x=>x.id===partnerId);
  if(!p) return;
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2>تسجيل دفعة لـ ${escapeHtml(p.name)}</h2>
      <div class="fin-sub">المستحقات الحالية: ${money(p.dueBalance||0)} د.أ</div>
      <div class="field" style="margin-top:10px;">
        <label>المبلغ المدفوع (د.أ) *</label>
        <input type="number" min="0" step="0.01" id="poAmount" value="${(p.dueBalance||0).toFixed(2)}">
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-block" onclick="savePartnerPayout('${p.id}')">تأكيد الدفعة</button>
      </div>
      <div style="margin-top:8px; text-align:center;"><button class="btn btn-ghost btn-sm" onclick="closeModal()">إلغاء</button></div>
    </div>
  </div>`;
}

async function savePartnerPayout(partnerId){
  const p = PARTNERS.find(x=>x.id===partnerId);
  if(!p) return;
  const amount = parseFloat(document.getElementById('poAmount').value || '0');
  if(isNaN(amount) || amount<=0){ toast('المبلغ غير صحيح'); return; }
  if(amount > (p.dueBalance||0) + 0.01){ toast('المبلغ أكبر من المستحقات'); return; }
  p.dueBalance = (p.dueBalance||0) - amount;
  PARTNER_PAYOUTS.push({id:uid('pay'), partnerId:p.id, partnerName:p.name, amount, createdAt:Date.now()});
  await savePartners();
  await savePartnerPayouts();
  closeModal();
  toast('تم تسجيل الدفعة');
  render();
  logActivity('partner_payout', `دفعة ${money(amount)} د.أ للشريك "${p.name}"`, {partnerId});
}

// ---- profit split config ----
function openSplitConfigModal(){
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2>تعديل نسب توزيع الأرباح</h2>
      <div class="fin-sub">لازم مجموع الثلاث نسب يساوي 100%</div>
      <div class="field" style="margin-top:10px;">
        <label>إعادة استثمار (رأس المال) %</label>
        <input type="number" min="0" max="100" step="1" id="spReinvest" value="${FINANCE.splitReinvestPct}">
      </div>
      <div class="field">
        <label>أرباح الشركاء %</label>
        <input type="number" min="0" max="100" step="1" id="spOwner" value="${FINANCE.splitOwnerPct}">
      </div>
      <div class="field">
        <label>احتياطي الطوارئ %</label>
        <input type="number" min="0" max="100" step="1" id="spReserve" value="${FINANCE.splitReservePct}">
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-block" onclick="saveSplitConfig()">حفظ النسب</button>
      </div>
      <div style="margin-top:8px; text-align:center;"><button class="btn btn-ghost btn-sm" onclick="closeModal()">إلغاء</button></div>
    </div>
  </div>`;
}

async function saveSplitConfig(){
  const r = parseFloat(document.getElementById('spReinvest').value || '0');
  const o = parseFloat(document.getElementById('spOwner').value || '0');
  const v = parseFloat(document.getElementById('spReserve').value || '0');
  if(Math.round(r+o+v)!==100){ toast('لازم مجموع النسب الثلاثة يساوي 100%'); return; }
  FINANCE.splitReinvestPct=r; FINANCE.splitOwnerPct=o; FINANCE.splitReservePct=v;
  await saveFinanceConfig();
  closeModal();
  toast('تم حفظ نسب التوزيع');
  render();
  logActivity('split_config', `تعديل نسب توزيع الأرباح (إعادة استثمار ${r}% / شركاء ${o}% / احتياطي ${v}%)`, {r,o,v});
}

// ---- settlement ----
function openSettleModal(){
  const prev = computeSettlementPreview();
  const noProfit = prev.stats.netProfit<=0;
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2>تصفية الأرباح</h2>
      <div class="fin-sub">الفترة: ${FINANCE.lastSettlementAt ? formatDate(FINANCE.lastSettlementAt) : 'بداية العمل'} ← اليوم</div>
      <div class="fin-grid" style="margin:14px 0;">
        <div class="fin-tile"><div class="n">${money(prev.stats.totalRevenue)}</div><div class="l">مقبوضات</div></div>
        <div class="fin-tile"><div class="n">${money(prev.stats.cogs)}</div><div class="l">تكلفة البضاعة</div></div>
        <div class="fin-tile"><div class="n">${money(prev.stats.expensesTotal)}</div><div class="l">مصاريف</div></div>
        <div class="fin-tile"><div class="n ${prev.stats.netProfit<0?'neg':''}">${money(prev.stats.netProfit)}</div><div class="l">صافي الربح</div></div>
      </div>
      ${noProfit
        ? `<div class="empty-mini">${prev.stats.netProfit===0 ? 'ما في ربح أو خسارة هالفترة.' : 'في خسارة هالفترة، رح تُخصم بالكامل من رأس المال النقدي.'}</div>`
        : `
        <div class="list-row"><div class="lr-main"><div class="lr-title">إعادة استثمار (${FINANCE.splitReinvestPct}%)</div></div><div class="lr-amount pos">+${money(prev.reinvestAmount)}</div></div>
        <div class="list-row"><div class="lr-main"><div class="lr-title">أرباح الشركاء (${FINANCE.splitOwnerPct}%)</div></div><div class="lr-amount pos">+${money(prev.ownerAmount)}</div></div>
        <div class="list-row"><div class="lr-main"><div class="lr-title">احتياطي الطوارئ (${FINANCE.splitReservePct}%)</div></div><div class="lr-amount pos">+${money(prev.reserveAmount)}</div></div>
        `
      }
      <div class="modal-actions" style="margin-top:14px;">
        <button class="btn btn-primary btn-block" onclick="confirmSettle()">تأكيد التصفية</button>
      </div>
      <div style="margin-top:8px; text-align:center;"><button class="btn btn-ghost btn-sm" onclick="closeModal()">إلغاء</button></div>
    </div>
  </div>`;
}

async function confirmSettle(){
  const prev = computeSettlementPreview();
  const now = Date.now();
  FINANCE.capitalBalance += prev.reinvestAmount;
  FINANCE.reserveBalance += prev.reserveAmount;
  if(prev.reserveAmount !== 0){
    RESERVE_LOG.push({id:uid('res'), type: prev.reserveAmount>=0?'add':'use', amount:prev.reserveAmount, note:'تصفية أرباح', createdAt:now});
  }
  if(prev.reinvestAmount !== 0){
    CAPITAL_LOG.push({id:uid('cap'), type:'settlement', amount:prev.reinvestAmount, note:'تصفية أرباح', createdAt:now});
  }
  prev.partnerBreakdown.forEach(pb=>{
    const p = PARTNERS.find(x=>x.id===pb.partnerId);
    if(p) p.dueBalance = (p.dueBalance||0) + pb.amount;
  });
  SETTLEMENTS.push({
    id: uid('stl'), createdAt: now,
    periodFrom: FINANCE.lastSettlementAt || 0, periodTo: now,
    totalRevenue: prev.stats.totalRevenue, cogs: prev.stats.cogs, expensesTotal: prev.stats.expensesTotal,
    netProfit: prev.stats.netProfit, reinvestAmount: prev.reinvestAmount, ownerAmount: prev.ownerAmount,
    reserveAmount: prev.reserveAmount, partnerBreakdown: prev.partnerBreakdown
  });
  FINANCE.lastSettlementAt = now;
  await saveFinanceConfig();
  await saveCapitalLog();
  await saveReserveLog();
  await savePartners();
  await saveSettlements();
  closeModal();
  toast('تمت تصفية الأرباح بنجاح 🎉');
  render();
  logActivity('settlement', `تصفية أرباح — صافي الربح ${money(prev.stats.netProfit)} د.أ`, {netProfit: prev.stats.netProfit});
}

// ---------- init ----------
loadAll();
loadViewModePref();
loadThemeModePref();
loadThemeCustomSettings();
</script>
