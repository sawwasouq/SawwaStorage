<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مخزون SawwaSouq</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap');

:root{
  /* ===== Sawwa Souq brand palette — soft & gentle ===== */
  --paper:#F3F6F5;
  --card:#FFFFFF;
  --ink:#233F3A;
  --ink-soft:#7B9995;
  --line:#E3EBE9;
  --teal:#2E8578;
  --teal-dark:#1B4640;
  --sage:#A9C2BE;
  --amber:#D9B27F;
  --rust:#C68B6C;
  --green:#7CAB84;
  --red:#C97F72;
  --shadow: 0 3px 12px rgba(27,70,64,.06);
}
/* ===== Dark theme ===== */
body.dark-theme{
  --paper:#12201D;
  --card:#1B2B27;
  --ink:#E8F0ED;
  --ink-soft:#9DB6B1;
  --line:#2B3D38;
  --teal:#4CAF9B;
  --teal-dark:#2A6459;
  --sage:#87A6A1;
  --amber:#E2BE8C;
  --rust:#D69B7E;
  --green:#8DC195;
  --red:#D69083;
  --shadow: 0 3px 14px rgba(0,0,0,.32);
}
body.dark-theme{
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.025) 1px, transparent 0) 0 0/16px 16px,
    var(--paper);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 1px 1px, rgba(27,70,64,.04) 1px, transparent 0) 0 0/16px 16px,
    var(--paper);
  color:var(--ink);
  font-family:'Baloo Bhaijaan 2', 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  min-height:100vh;
  padding-bottom:100px;
  overflow-x:hidden;
  transition:background-color .2s, color .2s;
}
/* Desktop-view mode: force the real desktop width and scroll sideways instead of
   zooming/scaling the page down — this keeps text and controls at full, normal size
   in BOTH modes, and mobile mode is never affected by having used desktop mode. */
body.force-desktop{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
body.force-desktop header, body.force-desktop main{ min-width:1100px; }
.mono{font-family:'Orbitron', 'JetBrains Mono', monospace; letter-spacing:.2px;}

/* ===== Header ===== */
header{
  background:linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 130%);
  color:#F3F6F5;
  padding:20px 22px 18px;
  position:sticky; top:0; z-index:30;
  border-radius:0 0 26px 26px;
  box-shadow:0 10px 24px -8px rgba(27,70,64,.35);
}
.header-inner{display:flex; align-items:center; justify-content:space-between; max-width:1100px; margin:0 auto; gap:14px;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:44px;height:44px;border-radius:15px;
  background:#F3F6F5;
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron','Baloo Bhaijaan 2',sans-serif;
  font-weight:800;color:var(--teal-dark);font-size:20px;
  box-shadow:0 4px 10px rgba(0,0,0,.16);
  overflow:hidden;
}
.brand-mark img{width:100%;height:100%;object-fit:cover;}
.brand-text h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.3px;}
.season-switch{
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3);
  color:#fff; font-family:'Orbitron','JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.3px;
  padding:3px 10px; border-radius:20px; cursor:pointer; transition:.15s; font-weight:700;
}
.season-switch:hover{background:rgba(255,255,255,.26);}

.header-right{display:flex; align-items:center; gap:10px;}
.view-mode-btn{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
  color:#F3F6F5; width:38px; height:38px; border-radius:13px; font-size:17px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:.15s; flex-shrink:0;
}
.view-mode-btn:hover{background:rgba(255,255,255,.22); transform:translateY(-1px);}

.tabs{display:flex; gap:4px; background:rgba(255,255,255,.12); padding:5px; border-radius:16px;}
.tab-btn{
  background:transparent;border:none;color:#E4EEEB;padding:9px 16px;border-radius:12px;
  font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;transition:.18s;
}
.tab-btn.active{background:#F3F6F5; color:var(--teal-dark); box-shadow:0 3px 8px rgba(0,0,0,.14);}
.tab-count{
  display:inline-block;margin-inline-start:6px;background:rgba(255,255,255,.2);
  border-radius:20px;padding:1px 7px;font-size:11px;font-family:'Orbitron','JetBrains Mono',monospace;
}
.tab-btn.active .tab-count{background:var(--sage); color:var(--teal-dark);}

main{max-width:1100px; margin:0 auto; padding:26px 18px;}

/* ===== Toolbar ===== */
.toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.toolbar h2{margin:0;font-size:21px; font-weight:900; color:var(--teal-dark);}
.toolbar .sub{color:var(--ink-soft); font-size:13px; margin-top:2px;}

.btn{
  border:none;border-radius:999px;padding:11px 18px;font-family:inherit;font-weight:700;
  font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.16s;
  white-space:nowrap;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--teal); color:#fff; box-shadow:0 4px 12px rgba(46,133,120,.28);}
.btn-primary:hover{background:var(--teal-dark); transform:translateY(-1px);}
.btn-amber{background:var(--amber); color:#4A3821;}
.btn-amber:hover{filter:brightness(1.06); transform:translateY(-1px);}
.btn-outline{background:var(--card); border:1.5px solid var(--line); color:var(--ink);}
.btn-outline:hover{border-color:var(--teal); color:var(--teal);}
.btn-ghost{background:transparent; color:var(--ink-soft); padding:6px 10px; border-radius:10px;}
.btn-danger{background:transparent;color:var(--red);border:1.5px solid #EAD8D2;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-sm{padding:8px 13px; font-size:12.5px; border-radius:999px;}
.btn-block{width:100%; justify-content:center;}

/* ===== Product grid ===== */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:18px;}
.category-divider{
  grid-column:1/-1; display:flex; align-items:center; gap:10px;
  margin:26px 0 4px;
}
.category-divider:first-child{ margin-top:0; }
.category-divider .cd-title{
  font-weight:800; font-size:14px; white-space:nowrap; color:var(--teal-dark);
  background:var(--sage); padding:5px 14px; border-radius:20px;
}
.category-divider .cd-count{
  font-family:'Orbitron','JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);
  background:var(--card); border:1px solid var(--line); border-radius:20px; padding:1px 9px; white-space:nowrap;
}
.category-divider::after{content:""; flex:1; height:1px; background:var(--line);}
.category-divider .cd-actions{display:flex; gap:4px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:22px; overflow:hidden;
  box-shadow:var(--shadow); position:relative; display:flex; flex-direction:column;
  transition:box-shadow .2s, transform .2s;
}
.card:hover{ box-shadow:0 12px 26px -6px rgba(27,70,64,.16); transform:translateY(-3px); }
.card-img{
  width:100%; background:var(--sage); position:relative;
  display:flex;align-items:center;justify-content:center; color:var(--teal-dark); font-size:12px; opacity:.75;
}
.card-img img{width:100%; height:auto; display:block;}
.card-img.empty{height:140px;}
.card-img.empty::after{content:"لا توجد صورة";}
.stock-tag{
  position:absolute; top:10px; left:10px; background:rgba(27,70,64,.85); color:#F3F6F5;
  font-family:'Orbitron','JetBrains Mono',monospace; font-size:11.5px; padding:3px 9px; border-radius:20px;
  backdrop-filter:blur(2px);
}
.stock-tag.zero{background:var(--red);}
.stock-tag.low{background:var(--rust);}
.card-body{padding:14px 15px 15px; display:flex; flex-direction:column; gap:6px; flex:1;}
.card-body h3{margin:0; font-size:15px; font-weight:600; line-height:1.3;}
.price{color:var(--teal-dark); font-weight:800; font-family:'Orbitron','JetBrains Mono',monospace; font-size:14.5px;}
.card-actions{display:flex; gap:6px; margin-top:auto; padding-top:8px;}


.empty-state{
  text-align:center; padding:64px 20px; color:var(--ink-soft);
  border:2px dashed var(--sage); border-radius:22px; background:rgba(255,255,255,.5);
}
.empty-state .big{font-size:38px; margin-bottom:8px;}

/* ===== Orders ===== */
.order-list{display:flex; flex-direction:column; gap:12px;}
.order-card{
  background:var(--card); border:1px solid var(--line); border-radius:19px; padding:16px 18px;
  box-shadow:var(--shadow);
}
.order-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.order-id{font-family:'Orbitron','JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}
.order-customer{font-weight:700; font-size:14.5px; margin-top:2px;}
.badge{
  font-size:12px; font-weight:700; padding:5px 13px; border-radius:20px; white-space:nowrap;
  display:inline-flex; align-items:center; gap:5px;
}
.badge::before{content:""; width:7px;height:7px;border-radius:50%; background:currentColor;}
.badge-warehouse{background:#F3E7D5; color:#A9803F;}
.badge-delivering{background:#F2E0D4; color:var(--rust);}
.badge-done{background:#E1EEE2; color:var(--green);}
.badge-cancelled{background:#F3DFDA; color:var(--red);}

.order-items{margin:12px 0; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:10px 0;}
.order-item-row{display:flex; justify-content:space-between; font-size:13.5px; padding:3px 0; color:var(--ink);}
.order-item-row span:last-child{font-family:'Orbitron','JetBrains Mono',monospace; color:var(--ink-soft);}
.order-total{display:flex; justify-content:space-between; font-weight:900; font-size:15px; margin-top:4px;}
.order-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:10px; flex-wrap:wrap;}

/* ===== Customers ===== */
.customer-list{display:flex; flex-direction:column; gap:12px;}
.customer-card{
  background:var(--card); border:1px solid var(--line); border-radius:19px; padding:16px 18px;
  box-shadow:var(--shadow);
}
.customer-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.customer-name{font-weight:700; font-size:15px;}
.customer-meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.customer-stats{display:flex; gap:16px; margin:10px 0; padding:10px 0; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line);}
.customer-stats .cs-item{font-size:12.5px; color:var(--ink-soft);}
.customer-stats .cs-item b{display:block; font-family:'Orbitron','JetBrains Mono',monospace; font-size:15px; font-weight:900; color:var(--teal-dark);}
.customer-products{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.customer-product-tag{
  background:var(--sage); color:var(--teal-dark); font-size:11.5px; font-weight:700;
  padding:3px 11px; border-radius:20px;
}

/* ===== Cart floating ===== */
.cart-fab{
  position:fixed; bottom:22px; left:22px; z-index:40;
  background:linear-gradient(135deg, var(--amber), #C99A62); color:#3F2E17; border:none;
  padding:15px 22px; border-radius:999px; font-family:inherit; font-weight:900; font-size:15px;
  box-shadow:0 10px 22px -6px rgba(27,70,64,.35); cursor:pointer; display:flex; align-items:center; gap:8px;
  transition:transform .15s;
}
.cart-fab:hover{ transform:translateY(-2px); }
.cart-fab .n{background:var(--teal-dark); color:#fff; border-radius:50%; width:22px;height:22px;
  display:flex;align-items:center;justify-content:center; font-size:12px;}

/* ===== Modal ===== */
.overlay{
  position:fixed; inset:0; background:rgba(20,30,28,.45); backdrop-filter:blur(2px); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal{
  background:var(--paper); border-radius:24px; width:100%; max-width:460px;
  max-height:88vh; overflow-y:auto; padding:24px; border:1px solid var(--line);
  box-shadow:0 20px 46px rgba(27,70,64,.24);
}
.modal h2{margin:0 0 16px; font-size:19px; font-weight:900; color:var(--teal-dark);}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:700; margin-bottom:5px; color:var(--ink-soft);}
.field input, .field textarea{
  width:100%; padding:11px 14px; border-radius:14px; border:1.5px solid var(--line);
  font-family:inherit; font-size:14px; background:var(--card); color:var(--ink);
}
.field input:focus, .field textarea:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.img-upload{
  border:2px dashed var(--sage); border-radius:16px; padding:14px; text-align:center;
  cursor:pointer; color:var(--ink-soft); font-size:13px; background:var(--card);
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.img-upload img{max-height:110px; border-radius:12px;}
.modal-actions{display:flex; gap:10px; margin-top:6px;}

/* ===== Theme customization ===== */
.mode-switch{display:flex; gap:8px; margin-bottom:16px;}
.mode-switch button{
  flex:1; padding:10px 8px; border-radius:14px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink-soft); font-family:inherit; font-weight:700;
  font-size:13.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
}
.mode-switch button.active{background:var(--teal); border-color:var(--teal); color:#fff;}
.color-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
.color-field{display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); border-radius:14px; padding:7px 10px; background:var(--card);}
.color-field label{flex:1; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:0;}
.color-field input[type="color"]{
  width:32px; height:32px; border-radius:10px; border:1.5px solid var(--line); padding:0; cursor:pointer; background:none;
}
.logo-upload-row{display:flex; align-items:center; gap:12px;}
.logo-upload-row .img-upload{flex-shrink:0; width:72px; height:72px; padding:0; justify-content:center;}
.logo-upload-row .img-upload img{max-height:100%; max-width:100%; object-fit:cover;}
.logo-upload-row .field{flex:1; margin:0;}

/* cart modal items */
.cart-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.cart-row img, .cart-row .ph{width:44px;height:44px;border-radius:12px;object-fit:cover; background:var(--sage); flex-shrink:0;}
.cart-row .info{flex:1; min-width:0;}
.cart-row .info h4{margin:0; font-size:13.5px; font-weight:700;}
.cart-row .info .p{font-size:12px; color:var(--ink-soft); font-family:'Orbitron','JetBrains Mono',monospace;}
.qty-ctrl{display:flex; align-items:center; gap:6px;}
.qty-ctrl button{
  width:26px;height:26px;border-radius:9px;border:1px solid var(--line); background:var(--card);
  cursor:pointer; font-weight:900; color:var(--teal); font-size:14px;
}
.qty-ctrl span{min-width:18px; text-align:center; font-family:'Orbitron','JetBrains Mono',monospace; font-weight:700;}
.cart-empty{text-align:center; padding:30px 10px; color:var(--ink-soft);}
.cart-total{display:flex;justify-content:space-between;font-weight:900;font-size:17px;margin:14px 0;
  padding-top:12px; border-top:2px solid var(--sage);}

/* ===== Stats & filters ===== */
.stats-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
.stat-card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:11px 18px; min-width:120px; box-shadow:var(--shadow); border-inline-start:4px solid var(--teal);
}
.stat-card .n{font-family:'Orbitron','JetBrains Mono',monospace; font-weight:900; font-size:19px; color:var(--teal-dark);}
.stat-card .l{font-size:12px; color:var(--ink-soft); margin-top:1px;}
.stat-card.warn{ border-inline-start-color:var(--rust); }
.stat-card.warn .n{color:var(--rust);}

.search-box{
  position:relative; min-width:200px; flex:1; max-width:280px;
}
.search-box input{
  width:100%; padding:10px 14px 10px 34px; border-radius:14px; border:1.5px solid var(--line);
  font-family:inherit; font-size:13.5px; background:var(--card); color:var(--ink);
}
.search-box input:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
.search-box::before{
  content:"🔍"; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:12px; opacity:.6;
}
.search-count-line{font-size:12px; color:var(--ink-soft); margin-top:4px; min-height:14px;}

.filter-chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px;}
.chip{
  border:1.5px solid var(--line); background:var(--card); color:var(--ink-soft);
  padding:7px 15px; border-radius:20px; font-family:inherit; font-size:13px; font-weight:700;
  cursor:pointer; transition:.15s;
}
.chip.active{background:var(--teal); border-color:var(--teal); color:#fff;}
.chip .c{font-family:'Orbitron','JetBrains Mono',monospace; opacity:.85; margin-inline-start:4px;}

.order-note{font-size:12.5px; color:var(--ink-soft); padding-top:6px;}
.order-note-box{
  background:var(--sage); background:color-mix(in srgb, var(--sage) 35%, var(--card)); border:none; border-inline-start:4px solid var(--amber);
  border-radius:12px; padding:9px 12px; font-size:12.5px; color:var(--ink); margin:8px 0;
  line-height:1.6; white-space:pre-wrap; word-break:break-word;
}
.icon-btn{
  background:transparent; border:1.5px solid var(--line); border-radius:11px; width:32px; height:32px;
  cursor:pointer; font-size:13px; color:var(--ink-soft); display:inline-flex; align-items:center; justify-content:center;
  transition:.15s;
}
.icon-btn:hover{border-color:var(--teal); color:var(--teal); background:var(--sage);}

/* ===== Product drag & drop reorder ===== */
.category-group{ display:contents; } /* keeps children in the parent CSS grid */
.card.reorder-mode{ cursor:grab; }
.drag-handle{
  display:flex; align-items:center; justify-content:center;
  background:var(--paper); border:1.5px dashed var(--sage); border-radius:11px;
  color:var(--ink-soft); font-size:16px; padding:6px; margin-top:6px;
  cursor:grab; touch-action:none; user-select:none; letter-spacing:2px;
}
.drag-handle:active{ cursor:grabbing; }
.drag-ghost{ opacity:.35; }
.drag-chosen .card, .card.drag-chosen{ box-shadow:0 10px 22px rgba(27,70,64,.22); }
.drag-drag{ transform:rotate(-1.5deg); }

/* ===== Finance page ===== */
.select-field{
  width:100%; padding:11px 14px; border-radius:14px; border:1.5px solid var(--line);
  font-family:inherit; font-size:14px; background:var(--card); color:var(--ink);
}
.select-field:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}

.sale-section{margin-top:18px;}
.sale-section:first-child{margin-top:0;}
.sale-section-label{
  font-size:11.5px; font-weight:800; color:var(--teal-dark); text-transform:uppercase;
  letter-spacing:.6px; margin-bottom:8px; display:flex; align-items:center; gap:6px;
}
.sale-section-label .ic{font-size:13px;}

.cart-row{position:relative; padding-inline-start:0;}
.cart-row .line-total{font-family:'Orbitron','JetBrains Mono',monospace; font-weight:800; font-size:13.5px; color:var(--teal-dark); min-width:62px; text-align:left;}
.cart-row .remove-x{
  background:transparent; border:none; color:var(--ink-soft); font-size:15px; cursor:pointer;
  width:22px; height:22px; line-height:1; border-radius:8px; flex-shrink:0;
}
.cart-row .remove-x:hover{color:var(--red); background:#F3DFDA;}
.cart-price-input{
  width:66px; padding:3px 6px; border-radius:9px; border:1.5px solid var(--line);
  background:var(--card); color:var(--teal-dark); font-family:'Orbitron','JetBrains Mono',monospace;
  font-weight:700; font-size:12.5px; text-align:center;
}
.cart-price-input:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}

.item-count-pill{
  background:var(--teal); color:#fff; font-family:'Orbitron','JetBrains Mono',monospace; font-size:11.5px;
  font-weight:800; padding:2px 9px; border-radius:20px; margin-inline-start:6px;
}

.receipt-box{
  background:var(--card); border:1.5px dashed var(--sage); border-radius:16px;
  padding:14px 16px; margin-top:4px;
}
.receipt-box .r-row{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0; color:var(--ink-soft);}
.receipt-box .r-row.grand{
  border-top:1.5px solid var(--sage); margin-top:6px; padding-top:10px;
  font-size:17px; font-weight:900; color:var(--ink);
}

const firebaseConfig = {
  apiKey: "AIzaSyAHz3anxeVjOm-y0w1w-Sb8vvBYjeV8gC4",
  authDomain: "sawwa-60ae2.firebaseapp.com",
  projectId: "sawwa-60ae2",
  storageBucket: "sawwa-60ae2.firebasestorage.app",
  messagingSenderId: "571078819349",
  appId: "1:571078819349:web:ec8dc899ca19db81d6981c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ====== بديل window.storage يشتغل على Firestore بدل خزنة Claude المؤقتة ======
// نفس الشكل تماماً (get/set/delete/list) عشان باقي الكود ما يحتاج أي تعديل.
window.storage = {
  async get(key, shared = false){
    const col = shared ? 'shared_storage' : 'storage';
    const snap = await db.collection(col).doc(key).get();
    if(!snap.exists) return null;
    return { key, value: snap.data().value, shared };
  },
  async set(key, value, shared = false){
    const col = shared ? 'shared_storage' : 'storage';
    await db.collection(col).doc(key).set({ value, updatedAt: Date.now() });
    return { key, value, shared };
  },
  async delete(key, shared = false){
    const col = shared ? 'shared_storage' : 'storage';
    await db.collection(col).doc(key).delete();
    return { key, deleted: true, shared };
  },
  async list(prefix = '', shared = false){
    const col = shared ? 'shared_storage' : 'storage';
    const snap = await db.collection(col).get();
    const keys = snap.docs.map(d => d.id).filter(k => k.startsWith(prefix || ''));
    return { keys, prefix, shared };
  }
};

<script>
// ---------- global double-click guard ----------
// Fixes double actions (double product, double order, double payout...) that
// happen when someone taps/clicks a button twice fast, before the UI (or the
// async save) has a chance to update. This runs in the CAPTURE phase, so it
// intercepts the click before the button's own onclick="..." runs, and simply
// swallows a second click on the exact same button element within 700ms.
// If the button is re-rendered (e.g. modal closes) it's a new element, so a
// genuine next click on a fresh screen is never blocked.
(function(){
  let lastEl = null, lastTime = 0;
  document.addEventListener('click', function(e){
    const btn = e.target.closest('button, .icon-btn, .season-switch');
    if(!btn) return;
    const now = Date.now();
    if(btn === lastEl && (now - lastTime) < 700){
      e.stopImmediatePropagation();
      e.preventDefault();
      return;
    }
    lastEl = btn;
    lastTime = now;
  }, true);
})();

// ---------- detailed theme customization (colors, logo, site name) — shared across the whole site ----------
function applyCustomTheme(custom){
  const root = document.documentElement.style;
  const colorKeys = { teal:'--teal', tealDark:'--teal-dark', amber:'--amber', paper:'--paper', card:'--card', ink:'--ink' };
  Object.entries(colorKeys).forEach(([k, cssVar])=>{
    if(custom && custom.colors && custom.colors[k]){
      root.setProperty(cssVar, custom.colors[k]);
    } else {
      root.removeProperty(cssVar);
    }
  });

  const mark = document.getElementById('brandMark');
  if(mark){
    if(custom && custom.logoImage){
      mark.innerHTML = `<img src="${custom.logoImage}" alt="شعار">`;
    } else {
      mark.textContent = (custom && custom.brandText) ? custom.brandText : DEFAULT_BRAND_TEXT;
    }
  }
  const titleEl = document.getElementById('siteTitleEl');
  const title = (custom && custom.siteTitle) ? custom.siteTitle : DEFAULT_SITE_TITLE;
  if(titleEl) titleEl.textContent = title;
  document.title = title;
}

function handleLogoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 160;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      editingLogoImage = canvas.toDataURL('image/jpeg', 0.85);
      openThemeSettingsModal();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function loadAll(){

    SHIPPING_COMPANIES = sc ? JSON.parse(sc.value) : [];
  }catch(e){ SHIPPING_COMPANIES = []; }

  try{
    const s = await window.storage.get('seasons-list', false);
    seasonsData = s ? JSON.parse(s.value) : null;
  }catch(e){ seasonsData = null; }

  if(!seasonsData || seasonsData.length===0){
    // first time ever running this refactor: the user's existing data lives under
    // the old flat (un-scoped) keys. Treat all of it as "الموسم الأول" and migrate it.
    const season1 = {id:'season_1', name:'الموسم الأول', createdAt:Date.now()};
    SEASONS = [season1];
    currentSeasonId = season1.id;
    await loadLegacyFlatData(); // populates PRODUCTS, ORDERS, etc. from the old flat keys
    await saveSeasonsList();
    await saveAppSettings();
    await saveAllCurrentSeasonData(); // persist that same data under the new scoped keys
  } else {
    SEASONS = seasonsData;
    let settings = null;
    try{
      const st = await window.storage.get('app-settings', false);
      settings = st ? JSON.parse(st.value) : null;
    }catch(e){ settings = null; }
    currentSeasonId = (settings && settings.currentSeasonId && SEASONS.find(s=>s.id===settings.currentSeasonId))
      ? settings.currentSeasonId : SEASONS[0].id;
    await loadSeasonData(currentSeasonId);
  }
  render();
}

function ensureDefaultFinance(){
  if(!FINANCE){
    FINANCE = {
      capitalBalance: 0,
      reserveBalance: 0,
      splitReinvestPct: 50,
      splitOwnerPct: 40,
      splitReservePct: 10,
      lastSettlementAt: null
    };
  }
}

function migrateLegacyOrderStatuses(){
  let migrated = false;
  ORDERS.forEach(o=>{
    if(o.status!=='delivering' && o.status!=='done' && o.status!=='cancelled'){
      o.status = 'delivering';
      migrated = true;
    }
  });
  if(migrated) saveOrders();
}

function suggestSeasonName(){
  const arNums = ['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
  const n = SEASONS.length; // next season index (0-based -> n is next ordinal-1)
  return 'الموسم ' + (arNums[n] || ('رقم '+(n+1)));
}

function deleteSeason(seasonId){
  if(SEASONS.length<=1){ toast('لازم يبقى موسم واحد على الأقل'); return; }
  const s = SEASONS.find(x=>x.id===seasonId);
  showConfirm(`حذف "${s.name}" نهائيًا؟ رح تنحذف كل منتجاته وطلباته وحساباته بدون رجعة.`, async ()=>{
    const sk = (base)=> base + '::' + seasonId;
    const keys = ['products-list','categories-list','orders-list','expenses-list','partners-list','capital-log','reserve-log','partner-payouts','settlements-list','restock-log','finance-config'];
    for(const k of keys){
      try{ await window.storage.delete(sk(k), false); }catch(e){ /* key may not exist, ignore */ }
    }
    SEASONS = SEASONS.filter(x=>x.id!==seasonId);
    await saveSeasonsList();
    allSeasonsSummaryCache = null;
    logActivity('season_delete', `حذف الموسم "${s.name}" وكل بياناته`, {seasonId});
    if(seasonId===currentSeasonId){
      await switchSeason(SEASONS[0].id);
    } else {
      openSeasonModal();
    }
  }, 'حذف الموسم');
}

function renderProductsStats(){
  const el = document.getElementById('productsStats');
  if(!el) return;
  const totalQty = PRODUCTS.reduce((s,p)=>s+p.qty,0);
  const lowStock = PRODUCTS.filter(p=>p.qty>0 && p.qty<=3).length;
  const outOfStock = PRODUCTS.filter(p=>p.qty===0).length;
  const totalValue = PRODUCTS.reduce((s,p)=>s+p.qty*p.price,0);
  const wholesaleValue = PRODUCTS.reduce((s,p)=>s+p.qty*(p.wholesalePrice||0),0);
  const expectedProfit = PRODUCTS.reduce((s,p)=>s+p.qty*(p.price-(p.wholesalePrice||0)),0);
  const revenueDone = ORDERS.filter(o=>o.status==='done').reduce((s,o)=>s+(o.subtotal ?? (o.total-(o.deliveryFee||0))),0);
  const expensesTotalAll = EXPENSES.reduce((s,e)=>s+e.amount,0);
  const cashAfterExpenses = revenueDone - expensesTotalAll;
  el.innerHTML = `
    <div class="stat-card"><div class="n">${PRODUCTS.length}</div><div class="l">منتج</div></div>
    <div class="stat-card"><div class="n">${totalQty}</div><div class="l">قطعة بالمستودع</div></div>
    <div class="stat-card"><div class="n">${money(totalValue)}</div><div class="l">قيمة المخزون بسعر البيع (د.أ)</div></div>
    <div class="stat-card"><div class="n">${money(wholesaleValue)}</div><div class="l">قيمة المخزون بسعر الجملة (د.أ)</div></div>
    <div class="stat-card"><div class="n">${money(expectedProfit)}</div><div class="l">الربح المتوقع (د.أ)</div></div>
    <div class="stat-card"><div class="n">${money(cashAfterExpenses)}</div><div class="l">مجموع الكاش بعد المصاريف (د.أ)</div></div>
    ${lowStock>0 ? `<div class="stat-card warn"><div class="n">${lowStock}</div><div class="l">كمية منخفضة</div></div>` : ''}
    ${outOfStock>0 ? `<div class="stat-card warn"><div class="n">${outOfStock}</div><div class="l">نافذ من المخزون</div></div>` : ''}
  `;
}

function renderProducts(){
  const grid = document.getElementById('productsGrid');
  const countEl = document.getElementById('productSearchCount');
  if(PRODUCTS.length===0){
    if(countEl) countEl.textContent = '';
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="big">📦</div>
      <div style="font-weight:700; margin-bottom:4px;">المستودع فاضي</div>
      <div style="font-size:13px;">ابدأ بإضافة أول منتج عندك</div>
    </div>`;
    return;
  }
  const q = productSearchQuery;
  const matchesSearch = p => !q || p.name.toLowerCase().includes(q);
  const totalMatches = PRODUCTS.filter(matchesSearch).length;
  if(countEl) countEl.textContent = q ? `${totalMatches} نتيجة` : '';
  if(q && totalMatches===0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="big">🔍</div>
      <div style="font-weight:700;">ما لقينا منتج يطابق البحث</div>
    </div>`;
    return;
  }

  // Group products into sections: "بدون قسم" (only shown if it has products) then
  // every defined category in its saved order — all on the SAME page, each section
  // is just a divider line with a title above its products (no separate tabs/pages).
  const groups = [];
  const uncategorized = PRODUCTS.filter(p=>!p.categoryId);
  if(uncategorized.length>0){
    groups.push({id:null, name:'بدون قسم', products:uncategorized});
  }
  CATEGORIES.forEach(cat=>{
    groups.push({id:cat.id, name:cat.name, products: PRODUCTS.filter(p=>p.categoryId===cat.id)});
  });

  let html = '';
  groups.forEach(g=>{
    const visible = g.products.filter(matchesSearch);
    if(q && visible.length===0) return; // hide empty sections while searching
    html += `<div class="category-divider">
      <span class="cd-title">${escapeHtml(g.name)}</span>
      <span class="cd-count">${g.products.length}</span>
    </div>`;
    if(visible.length===0){
      html += `<div class="empty-mini" style="grid-column:1/-1;">لا يوجد منتجات بهذا القسم بعد</div>`;
    } else {
      const catKey = g.id===null ? 'none' : g.id;
      html += `<div class="category-group" data-cat-key="${catKey}">${visible.map(p=>renderProductCard(p)).join('')}</div>`;
    }
  });
  grid.innerHTML = html;
  initProductSortables();
}

function renderProductCard(p){
  const stockClass = p.qty===0 ? 'zero' : (p.qty<=3 ? 'low' : '');
  const imgHtml = p.image
    ? `<div class="card-img"><img src="${p.image}" alt=""></div>`
    : `<div class="card-img empty"></div>`;
  const reorderRow = productReorderMode ? `

  return `
  <div class="card ${productReorderMode?'reorder-mode':''}" data-product-id="${p.id}">
    ${imgHtml}
    <div class="stock-tag ${stockClass}">الكمية: ${p.qty}</div>
    <div class="card-body">
      <h3>${escapeHtml(p.name)}</h3>
      <div class="price">${money(p.price)} د.أ <span style="font-size:11px; color:var(--ink-soft); font-weight:500;">مفرق</span></div>
      ${p.wholesalePrice ? `<div style="font-size:12px; color:var(--ink-soft); font-family:'Orbitron','JetBrains Mono',monospace; margin-top:-4px;">جملة: ${money(p.wholesalePrice)} د.أ</div>` : ''}
      <div class="card-actions">
        <button class="btn btn-primary btn-sm" style="flex:1" ${p.qty<=0?'disabled':''} onclick="quickSell('${p.id}')">بيع الآن</button>
        <button class="btn btn-outline btn-sm" ${p.qty<=0?'disabled':''} onclick="addToCart('${p.id}')" title="أضف للسلة">🛒</button>
        <button class="icon-btn" onclick="openRestockModal('${p.id}')" title="استلام بضاعة">📥</button>
        <button class="btn btn-ghost btn-sm" onclick="openProductModal('${p.id}')">تعديل</button>
      </div>
      ${reorderRow}
    </div>
  </div>`;
}

let productReorderMode = false;
let productSortables = [];

function toggleProductReorderMode(){
  if(!productReorderMode && productSearchQuery){
    toast('امسح البحث الأول قبل ما تبدأ الترتيب');
    return;
  }
  productReorderMode = !productReorderMode;
  const btn = document.getElementById('reorderProductsBtn');
  if(btn) btn.textContent = productReorderMode ? '✅ تم الترتيب' : '↕️ ترتيب المنتجات';
  renderProducts();
}

function destroyProductSortables(){
  productSortables.forEach(s=>{ try{ s.destroy(); }catch(e){} });
  productSortables = [];
}

function initProductSortables(){
  destroyProductSortables();
  if(!productReorderMode || typeof Sortable==='undefined') return;
  document.querySelectorAll('#productsGrid .category-group').forEach(group=>{
    const s = new Sortable(group, {
      handle: '.drag-handle',
      animation: 150,
      delay: 60,
      delayOnTouchOnly: true,
      ghostClass: 'drag-ghost',
      chosenClass: 'drag-chosen',
      dragClass: 'drag-drag',
      onEnd: ()=>{
        const catKey = group.dataset.catKey;
        const catId = catKey==='none' ? null : catKey;
        const orderedIds = Array.from(group.children)
          .map(el=>el.dataset.productId)
          .filter(Boolean);
        reorderProductsInCategory(catId, orderedIds);
      }
    });
    productSortables.push(s);
  });
}

async function reorderProductsInCategory(catId, orderedIds){
  // Rebuilds PRODUCTS keeping every OTHER category's items exactly where they
  // were, and swapping in this category's items in the new drag order — so
  // dragging within one section never disturbs the order of other sections.
  const byId = {};
  PRODUCTS.filter(p=>(p.categoryId||null)===catId).forEach(p=>{ byId[p.id]=p; });
  const newOrderForCat = orderedIds.map(id=>byId[id]).filter(Boolean);
  let ptr = 0;
  PRODUCTS = PRODUCTS.map(p=>{
    if((p.categoryId||null)===catId){
      const next = newOrderForCat[ptr];
      ptr++;
      return next || p;
    }
    return p;
  });
  await saveProducts();
}

const statusMeta = {
  delivering:{label:'قيد التوصيل', cls:'badge-delivering'},
  done:{label:'تم التسليم', cls:'badge-done'},
  cancelled:{label:'ملغي', cls:'badge-cancelled'}
};
function getStatusMeta(status){
  return statusMeta[status] || {label: status || 'غير معروف', cls:'badge-warehouse'};
}

function orderMatchesSearch(o, q){
  if(!q) return true;
  if(o.customer && o.customer.toLowerCase().includes(q)) return true;
  if(o.phone && o.phone.toLowerCase().includes(q)) return true;
  if((o.items||[]).some(it=>it.name && it.name.toLowerCase().includes(q))) return true;
  return false;
}

function renderOrders(){
  const list = document.getElementById('ordersList');
  const countEl = document.getElementById('orderSearchCount');
  if(ORDERS.length===0){
    if(countEl) countEl.textContent = '';
    list.innerHTML = `<div class="empty-state">

    </div>`;
    return;
  }
  let filteredOrders = orderFilter==='all' ? ORDERS : ORDERS.filter(o=>o.status===orderFilter);
  if(orderSearchQuery){
    filteredOrders = filteredOrders.filter(o=>orderMatchesSearch(o, orderSearchQuery));
  }
  if(countEl) countEl.textContent = orderSearchQuery ? `${filteredOrders.length} نتيجة` : '';
  if(filteredOrders.length===0){
    list.innerHTML = `<div class="empty-state">
      <div class="big">🧾</div>
      <div style="font-weight:700;">${orderSearchQuery ? 'ما في نتائج مطابقة' : 'ما في طلبات بهاي الحالة'}</div>

  }
  const sorted = [...filteredOrders].sort((a,b)=> b.createdAt - a.createdAt);
  list.innerHTML = sorted.map(o=>{

    const itemsHtml = o.items.map(it=>`
      <div class="order-item-row"><span>${escapeHtml(it.name)} × ${it.qty}</span><span>${money(it.price*it.qty)} د.أ</span></div>

    if(o.status==='delivering'){
      actions += `<button class="btn btn-primary btn-sm" onclick="advanceOrder('${o.id}')">✅ تم التسليم</button>

      actions += `<button class="icon-btn" onclick="openEditOrderModal('${o.id}')" title="تعديل الطلب بعد التسليم">✎</button>`;
    }
    actions += `<button class="icon-btn" onclick="openOrderNoteModal('${o.id}')" title="ملاحظة على الطلب">${o.note ? '🗒️' : '📝'}</button>`;

      <div class="order-item-row"><span>أجور التوصيل</span><span>${money(deliveryFee)} د.أ</span></div>

// ---------- customers (derived automatically from orders) ----------
function computeCustomersList(){
  const map = {};
  ORDERS.filter(o=>o.status!=='cancelled').forEach(o=>{
    const key = (o.phone && o.phone.trim()) || ('n:'+(o.customer||'-'));
    if(!map[key]){
      map[key] = {
        name: o.customer || 'عميل بدون اسم',
        phone: o.phone || '',
        address: o.address || '',
        orders: 0,
        total: 0,
        delivery: 0,
        lastAt: 0,
        products: {}
      };
    }
    const c = map[key];
    c.orders += 1;
    c.total += (o.subtotal ?? (o.total-(o.deliveryFee||0)));
    c.delivery += (o.deliveryFee||0);
    if(o.createdAt > c.lastAt){
      c.lastAt = o.createdAt;
      // keep the most recent address/name in case they were edited later
      if(o.customer) c.name = o.customer;
      if(o.address) c.address = o.address;
    }
    (o.items||[]).forEach(it=>{
      c.products[it.name] = (c.products[it.name]||0) + it.qty;
    });
  });
  return Object.values(map).sort((a,b)=>b.lastAt-a.lastAt);
}

function handleCustomerSearch(val){
  customerSearchQuery = val.trim().toLowerCase();
  renderCustomers();
}

function renderCustomers(){
  const statsEl = document.getElementById('customersStats');
  const listEl = document.getElementById('customersList');
  if(!listEl) return;

  const all = computeCustomersList();

  if(statsEl){
    const totalRevenue = all.reduce((s,c)=>s+c.total,0);

    statsEl.innerHTML = `
      <div class="stat-card"><div class="n">${all.length}</div><div class="l">إجمالي العملاء</div></div>
      <div class="stat-card"><div class="n">${money(totalRevenue)}</div><div class="l">إجمالي المبيعات (د.أ)</div></div>
      <div class="stat-card"><div class="n">${money(totalDelivery)}</div><div class="l">إجمالي أجور التوصيل (د.أ)</div></div>
    `;
  }

  let list = all;
  if(customerSearchQuery){
    list = list.filter(c=>
      c.name.toLowerCase().includes(customerSearchQuery) ||
      (c.phone && c.phone.toLowerCase().includes(customerSearchQuery)) ||
      Object.keys(c.products).some(name=>name.toLowerCase().includes(customerSearchQuery))
    );
  }
  const countEl = document.getElementById('customerSearchCount');
  if(countEl) countEl.textContent = customerSearchQuery ? `${list.length} نتيجة` : '';

  if(all.length===0){
    listEl.innerHTML = `<div class="empty-state">
      <div class="big">👥</div>
      <div style="font-weight:700; margin-bottom:4px;">لا يوجد عملاء بعد</div>
      <div style="font-size:13px;">أي طلب بيع جديد بيضيف صاحبه هون تلقائيًا</div>
    </div>`;
    return;
  }
  if(list.length===0){
    listEl.innerHTML = `<div class="empty-state">
      <div class="big">👥</div>
      <div style="font-weight:700;">ما في نتائج مطابقة</div>
    </div>`;
    return;
  }

  listEl.innerHTML = list.map(c=>{
    const addressLine = c.address ? `<div class="customer-meta">📍 ${escapeHtml(c.address)}</div>` : '';
    const productTags = Object.entries(c.products).map(([name,qty])=>
      `<span class="customer-product-tag">${escapeHtml(name)} × ${qty}</span>`
    ).join('');
    return `
    <div class="customer-card">
      <div class="customer-top">
        <div>
          <div class="customer-name">${escapeHtml(c.name)}</div>
          <div class="customer-meta">${c.phone ? '📞 '+escapeHtml(c.phone) : 'بدون رقم هاتف'}</div>
          ${addressLine}
        </div>
      </div>
      <div class="customer-stats">
        <div class="cs-item">عدد الطلبات<b>${c.orders}</b></div>
        <div class="cs-item">إجمالي المبيعات<b>${money(c.total)} د.أ</b></div>
        <div class="cs-item">أجور التوصيل<b>${money(c.delivery)} د.أ</b></div>
      </div>
      <div class="customer-products">${productTags}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s){

async function saveCategoryForm(categoryId){
  const name = document.getElementById('catName').value.trim();
  if(!name){ toast('اكتب اسم القسم'); return; }
  const isNew = !categoryId;
  if(categoryId){
    const c = CATEGORIES.find(x=>x.id===categoryId);
    c.name = name;
  } else {
    CATEGORIES.push({id:uid('cat'), name, createdAt:Date.now()});
  }
  await saveCategories();
  toast('تم الحفظ');
  render();
  logActivity(isNew ? 'category_add' : 'category_edit', `${isNew ? 'إضافة' : 'تعديل'} قسم "${name}"`, {});
  openCategoriesModal();
}

function deleteCategory(categoryId){
  const c = CATEGORIES.find(x=>x.id===categoryId);
  if(!c) return;
  const count = PRODUCTS.filter(p=>p.categoryId===categoryId).length;
  showConfirm(count>0 ? `حذف قسم "${c.name}"؟ منتجاته (${count}) رح ترجع لـ "بدون قسم".` : `حذف قسم "${c.name}"؟`, async ()=>{
    PRODUCTS.forEach(p=>{ if(p.categoryId===categoryId) p.categoryId = null; });
    CATEGORIES = CATEGORIES.filter(x=>x.id!==categoryId);
    await saveProducts();
    await saveCategories();
    render();
    logActivity('category_delete', `حذف قسم "${c.name}"`, {});
    openCategoriesModal();
  }, 'حذف القسم');
}

async function moveCategory(categoryId, direction){
  const idx = CATEGORIES.findIndex(c=>c.id===categoryId);
  if(idx===-1) return;
  const targetIdx = idx + direction;
  if(targetIdx<0 || targetIdx>=CATEGORIES.length) return;
  const tmp = CATEGORIES[idx];
  CATEGORIES[idx] = CATEGORIES[targetIdx];
  CATEGORIES[targetIdx] = tmp;
  await saveCategories();
  render();
  openCategoriesModal();
}

function buildCategorySelectOptions(selectedId){
  return `<option value="">بدون قسم</option>` + CATEGORIES.map(c=>
    `<option value="${c.id}" ${selectedId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`
  ).join('');
}

function handleImageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 500;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      editingImageData = canvas.toDataURL('image/jpeg', 0.82);
      const box = document.getElementById('imgUploadBox');
      box.innerHTML = `<img src="${editingImageData}" id="imgPreview"><input type="file" accept="image/*" style="display:none" id="imgInput" onchange="handleImageUpload(event)">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

  if(qty<0 || isNaN(qty)){ toast('الكمية غير صحيحة'); return; }
  if(price<0 || isNaN(price)){ toast('سعر البيع غير صحيح'); return; }
  if(wholesalePrice<0 || isNaN(wholesalePrice)){ toast('سعر الجملة غير صحيح'); return; }

  if(productId){
    const p = PRODUCTS.find(x=>x.id===productId);
    p.name=name; p.categoryId=categoryId; p.qty=qty; p.price=price; p.wholesalePrice=wholesalePrice; p.image=editingImageData;
    toast('تم حفظ التعديلات');

  render();
}

async function moveProductToSeason(productId, targetSeasonId){
  const p = PRODUCTS.find(x=>x.id===productId);
  if(!p) return;
  const targetKey = 'products-list::' + targetSeasonId;
  let targetProducts = [];
  try{
    const r = await window.storage.get(targetKey, false);
    targetProducts = r ? JSON.parse(r.value) : [];
  }catch(e){ targetProducts = []; }
  targetProducts.push(Object.assign({}, p, {categoryId: null}));
  try{
    await window.storage.set(targetKey, JSON.stringify(targetProducts), false);
  }catch(e){ toast('تعذّر النقل، حاول مجددًا'); return; }
  PRODUCTS = PRODUCTS.filter(x=>x.id!==productId);
  CART = CART.filter(c=>c.productId!==productId);
  await saveProducts();
  closeModal();
  const target = SEASONS.find(s=>s.id===targetSeasonId);
  toast(`تم نقل المنتج إلى ${target ? target.name : 'الموسم الآخر'}`);
  render();
  logActivity('product_move', `نقل المنتج "${p.name}" إلى موسم "${target ? target.name : ''}"`, {productId, targetSeasonId});
}

// ---------- selling ----------
function quickSell(productId){
  const p = PRODUCTS.find(x=>x.id===productId);
  if(!p || p.qty<=0) return;
  const existing = CART.find(c=>c.productId===productId);
  if(!existing){
    CART.push({productId, qty:1});
  }
  renderCartFab();
  openCartModal();
}

function addToCart(productId){
  const p = PRODUCTS.find(x=>x.id===productId);
  if(!p || p.qty<=0) return;
  const existing = CART.find(c=>c.productId===productId);
  const inCartQty = existing ? existing.qty : 0;
  if(inCartQty >= p.qty){ toast('الكمية المتوفرة كلها في السلة'); return; }
  if(existing) existing.qty += 1;
  else CART.push({productId, qty:1});
  renderCartFab();
  toast('أُضيف للسلة');
}

function openCartModal(){
  renderCartModalContent();
}

function getCartItemPrice(c, p){
  return (c.priceOverride!=null && !isNaN(c.priceOverride)) ? c.priceOverride : p.price;
}

function computeCartSubtotal(){
  return CART.reduce((s,c)=>{
    const p = PRODUCTS.find(x=>x.id===c.productId);
    return s + (p ? getCartItemPrice(c,p)*c.qty : 0);
  }, 0);
}

function updateCartItemPrice(productId, val){
  const c = CART.find(x=>x.productId===productId);
  if(!c) return;
  let v = parseFloat(val);
  if(isNaN(v) || v<0) v = 0;
  c.priceOverride = v;
  const p = PRODUCTS.find(x=>x.id===productId);
  const lt = document.getElementById('lt-'+productId);
  if(lt && p) lt.textContent = money(v*c.qty);
  recalcCartTotals();
}

function recalcCartTotals(){
  const subtotal = computeCartSubtotal();
  const feeInput = document.getElementById('cDeliveryFee');
  const fee = feeInput ? (parseFloat(feeInput.value)||0) : 0;
  const subEl = document.getElementById('rSubtotalDisplay');
  if(subEl) subEl.textContent = money(subtotal)+' د.أ';
  const delEl = document.getElementById('rDeliveryDisplay');
  if(delEl) delEl.textContent = money(fee)+' د.أ';
  const totEl = document.getElementById('cTotalDisplay');
  if(totEl) totEl.textContent = money(subtotal+fee)+' د.أ';
}

function removeCartItem(productId){
  CART = CART.filter(c=>c.productId!==productId);
  renderCartModalContent();
  renderCartFab();
}

function changeCartQty(productId, delta){
  const c = CART.find(x=>x.productId===productId);
  const p = PRODUCTS.find(x=>x.id===productId);
  if(!c || !p) return;
  const newQty = c.qty + delta;
  if(newQty <= 0){ CART = CART.filter(x=>x.productId!==productId); }
  else if(newQty > p.qty){ toast('ما في كمية كافية بالمستودع'); return; }
  else { c.qty = newQty; }
  renderCartModalContent();
  renderCartFab();
}

async function checkoutCart(){
  if(CART.length===0) return;
  const customer = document.getElementById('cCustomer').value.trim();
  const phone = document.getElementById('cPhone').value.trim();
  const address = document.getElementById('cAddress').value.trim();
  const deliveryFee = parseFloat(document.getElementById('cDeliveryFee').value || '0');
  const shippingId = document.getElementById('cShipping').value;

  if(!customer){ toast('اكتب اسم العميل'); return; }
  if(!phone){ toast('اكتب رقم هاتف العميل'); return; }
  if(!address){ toast('اكتب عنوان العميل'); return; }
  if(isNaN(deliveryFee) || deliveryFee<0){ toast('أجور التوصيل غير صحيحة'); return; }
  if(SHIPPING_COMPANIES.length>0 && !shippingId){ toast('اختر شركة الشحن'); return; }

  const shippingCompany = shippingId ? SHIPPING_COMPANIES.find(c=>c.id===shippingId) : null;

  const items = [];
  let itemsTotal = 0;
  for(const c of CART){
    const p = PRODUCTS.find(x=>x.id===c.productId);
    if(!p || p.qty < c.qty){ toast('في تعارض بالكمية، حاول مجددًا'); return; }
  }
  for(const c of CART){
    const p = PRODUCTS.find(x=>x.id===c.productId);
    const salePrice = getCartItemPrice(c,p);
    p.qty -= c.qty;
    items.push({productId:p.id, name:p.name, price:salePrice, wholesalePrice:p.wholesalePrice||0, qty:c.qty});
    itemsTotal += salePrice * c.qty;
  }
  const newOrder = {
    id: uid('ord'), items,
    subtotal: itemsTotal, deliveryFee, total: itemsTotal + deliveryFee,
    status:'delivering',
    customer, phone, address,
    shippingCompanyId: shippingCompany ? shippingCompany.id : null,
    shippingCompanyName: shippingCompany ? shippingCompany.name : '',
    shippingCompanyPhone: shippingCompany ? shippingCompany.phone : '',
    createdAt: Date.now()
  };
  ORDERS.push(newOrder);
  CART = [];
  await saveProducts();
  await saveOrders();
  closeModal();
  toast('تم تنفيذ عملية البيع، الطلب بطريقه للتوصيل 🚚');
  render();
  logActivity('order_create', `طلب جديد للعميل "${customer}" بقيمة ${money(newOrder.total)} د.أ`, {orderId:newOrder.id});
}

}

async function saveOrderEdit(orderId){
  const o = ORDERS.find(x=>x.id===orderId);
  if(!o) return;
  const customer = document.getElementById('eCustomer').value.trim();
  const phone = document.getElementById('ePhone').value.trim();
  const address = document.getElementById('eAddress').value.trim();
  const deliveryFee = parseFloat(document.getElementById('eDeliveryFee').value || '0');
  if(!customer){ toast('اكتب اسم العميل'); return; }
  if(!phone){ toast('اكتب رقم هاتف العميل'); return; }
  if(!address){ toast('اكتب عنوان العميل'); return; }
  if(isNaN(deliveryFee) || deliveryFee<0){ toast('أجور التوصيل غير صحيحة'); return; }

  let subtotal = 0;
  document.querySelectorAll('.oe-price-input').forEach(inp=>{
    const idx = parseInt(inp.dataset.idx, 10);
    let v = parseFloat(inp.value);
    if(isNaN(v) || v<0) v = 0;
    if(o.items && o.items[idx]){
      o.items[idx].price = v;
      subtotal += v * o.items[idx].qty;
    }
  });

  const shippingSel = document.getElementById('eShipping');
  const shippingId = shippingSel ? shippingSel.value : '';
  const shippingCompany = shippingId ? SHIPPING_COMPANIES.find(c=>c.id===shippingId) : null;

  o.customer = customer; o.phone = phone; o.address = address;
  o.deliveryFee = deliveryFee; o.subtotal = subtotal; o.total = subtotal + deliveryFee;
  o.shippingCompanyId = shippingCompany ? shippingCompany.id : null;
  o.shippingCompanyName = shippingCompany ? shippingCompany.name : '';
  o.shippingCompanyPhone = shippingCompany ? shippingCompany.phone : '';
  await saveOrders();
  closeModal();
  toast('تم تحديث بيانات الطلب');
  render();
  logActivity('order_edit', `تعديل بيانات الطلب #${o.id.slice(-6)} للعميل "${customer}"`, {orderId});
}

async function confirmCancelOrder(orderId, mode){
  const o = ORDERS.find(x=>x.id===orderId);
  if(!o) return;
  o.items.forEach(it=>{
    const p = PRODUCTS.find(x=>x.id===it.productId);
    if(p) p.qty += it.qty;
  });
  await saveProducts();
  if(mode==='revert'){
    ORDERS = ORDERS.filter(x=>x.id!==orderId);
  } else {
    o.status = 'cancelled';
    o.cancelReason = 'customer';
    o.cancelledAt = Date.now();
  }
  await saveOrders();
  closeModal();
  toast(mode==='revert' ? 'تم حذف الطلب وإرجاع الكمية للمخزون' : 'تم إلغاء الطلب وإرجاع الكمية للمخزون');
  render();
  if(mode==='revert'){
    logActivity('order_delete', `حذف الطلب #${o.id.slice(-6)} للعميل "${o.customer}" وإرجاع الكمية للمخزون`, {orderId});
  } else {
    logActivity('order_cancel', `إلغاء الطلب #${o.id.slice(-6)} للعميل "${o.customer}" (إلغاء من الزبون)`, {orderId});
  }
}

function renderCustomerPickerList(query){
  const box = document.getElementById('customerPickerBox');
  if(!box) return;
  const q = (query||'').trim().toLowerCase();
  let list = computeCustomersList();
  if(q){
    list = list.filter(c=>
      (c.name||'').toLowerCase().includes(q) ||
      (c.phone||'').replace(/\D/g,'').includes(q.replace(/\D/g,''))
    );
  }
  list = list.slice(0, 30);
  const rows = list.length ? list.map((c,i)=>`
    <div class="list-row" style="cursor:pointer;" onclick="pickCustomerFromList(${i}, '${escapeHtml(q).replace(/'/g,"\\'")}')">
      <div class="lr-main">
        <div class="lr-title">${escapeHtml(c.name)}</div>
        <div class="lr-sub">${escapeHtml(c.phone||'بدون رقم')}${c.address ? ' · '+escapeHtml(c.address) : ''}</div>
      </div>
      <div class="lr-amount" style="font-size:12px;">${c.orders} طلب</div>
    </div>
  `).join('') : `<div class="empty-mini">ما في عملاء مطابقين</div>`;
  box.innerHTML = `
    <div style="background:#EFE5CB; border-radius:10px; padding:10px; margin:-6px 0 12px;">
      <input type="text" placeholder="دور بالاسم أو رقم الهاتف" style="width:100%; margin-bottom:8px;" oninput="renderCustomerPickerList(this.value)" value="${escapeHtml(query||'')}">
      <div style="max-height:220px; overflow-y:auto;">${rows}</div>
    </div>
  `;
  // refocus the search box and keep cursor at the end after re-render
  const input = box.querySelector('input');
  if(input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

function pickCustomerFromList(idx, query){
  let list = computeCustomersList();
  const q = (query||'').trim().toLowerCase();
  if(q){
    list = list.filter(c=>
      (c.name||'').toLowerCase().includes(q) ||
      (c.phone||'').replace(/\D/g,'').includes(q.replace(/\D/g,''))
    );
  }
  const c = list[idx];
  if(!c) return;
  const pEl = document.getElementById('cPhone');
  const cEl = document.getElementById('cCustomer');
  const aEl = document.getElementById('cAddress');
  if(pEl) pEl.value = c.phone || '';
  if(cEl) cEl.value = c.name || '';
  if(aEl) aEl.value = c.address || '';
  document.getElementById('customerPickerBox').innerHTML = '';
  document.getElementById('customerSuggestion').innerHTML = '';
  toast('تم تعبئة بيانات العميل');
}

// ---------- customer lookup (autofill from previous orders) ----------
function handleCustomerLookup(){
  const phoneEl = document.getElementById('cPhone');
  const box = document.getElementById('customerSuggestion');
  if(!phoneEl || !box) return;
  const phone = phoneEl.value.trim();
  const digits = phone.replace(/\D/g,'');
  if(digits.length<6){ box.innerHTML=''; window._customerSuggestion=null; return; }
  const match = [...ORDERS]
    .filter(o=>o.phone && o.phone.replace(/\D/g,'')===digits)
    .sort((a,b)=>b.createdAt-a.createdAt)[0];
  if(match){
    window._customerSuggestion = match;
    box.innerHTML = `<div style="background:#EFE5CB; border-radius:8px; padding:9px 12px; font-size:12.5px; margin:-6px 0 12px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
      <span>عميل سابق: ${escapeHtml(match.customer||'')}${match.address ? ' — '+escapeHtml(match.address) : ''}</span>
      <button class="btn btn-outline btn-sm" style="padding:4px 10px; flex-shrink:0;" onclick="useCustomerSuggestion()">استخدام</button>
    </div>`;
  } else {
    window._customerSuggestion = null;
    box.innerHTML = '';
  }
}

function useCustomerSuggestion(){
  const m = window._customerSuggestion;
  if(!m) return;
  const cEl = document.getElementById('cCustomer');
  const aEl = document.getElementById('cAddress');
  if(cEl) cEl.value = m.customer || '';
  if(aEl) aEl.value = m.address || '';
  toast('تم تعبئة بيانات العميل');
}

// ---------- receipt / invoice ----------
function toWhatsAppNumber(phone){
  let digits = (phone||'').replace(/\D/g,'');
  if(digits.startsWith('00')) digits = digits.slice(2);
  if(digits.startsWith('962')) return digits;
  if(digits.startsWith('0')) return '962'+digits.slice(1);
  return '962'+digits;
}

function updateRestockPreview(){
  const qty = parseFloat(document.getElementById('rsQty').value||'0');
  const wp = parseFloat(document.getElementById('rsWholesale').value||'0');
  const el = document.getElementById('rsCostPreview');
  if(el) el.textContent = `التكلفة الإجمالية: ${money((qty||0)*(wp||0))} د.أ (تُخصم من رأس المال النقدي)`;
}

async function saveRestock(productId){
  const p = PRODUCTS.find(x=>x.id===productId);
  if(!p) return;
  const qty = parseInt(document.getElementById('rsQty').value||'0',10);
  const wholesalePrice = parseFloat(document.getElementById('rsWholesale').value||'0');
  const note = document.getElementById('rsNote').value.trim();
  if(isNaN(qty) || qty<=0){ toast('الكمية غير صحيحة'); return; }
  if(isNaN(wholesalePrice) || wholesalePrice<0){ toast('سعر الجملة غير صحيح'); return; }
  const totalCost = qty*wholesalePrice;
  p.qty += qty;
  if(wholesalePrice>0) p.wholesalePrice = wholesalePrice;
  RESTOCK_LOG.push({id:uid('rst'), productId:p.id, productName:p.name, qty, wholesalePrice, totalCost, note, createdAt:Date.now()});
  if(totalCost>0){
    FINANCE.capitalBalance -= totalCost;
    CAPITAL_LOG.push({id:uid('cap'), type:'withdrawal', amount:totalCost, note:`شراء بضاعة: ${p.name}`, createdAt:Date.now()});
  }
  await saveProducts();
  await saveRestockLog();
  await saveFinanceConfig();
  await saveCapitalLog();
  closeModal();
  toast('تم تسجيل استلام البضاعة، صارت بالمخزون 📦');
  render();
  logActivity('restock', `استلام ${qty} قطعة من "${p.name}" بتكلفة ${money(totalCost)} د.أ`, {productId});
}

// ---------- backup / restore ----------
function exportBackup(){
  const data = {
    version: 1, exportedAt: Date.now(),
    products: PRODUCTS, orders: ORDERS, expenses: EXPENSES, partners: PARTNERS,
    capitalLog: CAPITAL_LOG, reserveLog: RESERVE_LOG, partnerPayouts: PARTNER_PAYOUTS,
    settlements: SETTLEMENTS, restockLog: RESTOCK_LOG, finance: FINANCE
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sawwasouq-${(SEASONS.find(s=>s.id===currentSeasonId)||{name:'backup'}).name.replace(/\s+/g,'-')}-${formatDate(Date.now()).replace(/\//g,'-')}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('تم تنزيل النسخة الاحتياطية');
}

function triggerImportBackup(){
  const input = document.getElementById('importBackupInput');
  if(input) input.click();
}

async function handleImportBackup(e){
  const inputEl = e.target;
  const file = inputEl.files[0];
  if(!file) return;
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(err){ toast('الملف غير صالح'); inputEl.value=''; return; }
  showConfirm('استيراد هاي النسخة رح يستبدل كل البيانات الحالية بالكامل. متأكد؟', async ()=>{
    PRODUCTS = data.products || [];
    ORDERS = data.orders || [];
    EXPENSES = data.expenses || [];
    PARTNERS = (data.partners && data.partners.length) ? data.partners : PARTNERS;
    CAPITAL_LOG = data.capitalLog || [];
    RESERVE_LOG = data.reserveLog || [];
    PARTNER_PAYOUTS = data.partnerPayouts || [];
    SETTLEMENTS = data.settlements || [];
    RESTOCK_LOG = data.restockLog || [];
    FINANCE = data.finance || FINANCE;
    CART = [];
    await Promise.all([
      saveProducts(), saveOrders(), saveExpenses(), savePartners(), saveCapitalLog(),
      saveReserveLog(), savePartnerPayouts(), saveSettlements(), saveRestockLog(), saveFinanceConfig()
    ]);
    toast('تم استيراد النسخة الاحتياطية بنجاح');
    inputEl.value='';
    render();
  }, 'استيراد واستبدال');
}

// ---------- reports by period ----------
let reportCustomFrom = '';
let reportCustomTo = '';

function getPeriodStart(period){
  const now = new Date();
  if(period==='today'){
    return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  }
  if(period==='week'){
    const d = new Date(now);
    const day = d.getDay(); // 0=Sun
    const diff = (day===0 ? 6 : day-1); // start week on Monday
    d.setDate(d.getDate()-diff);
    d.setHours(0,0,0,0);
    return d.getTime();
  }
  if(period==='month'){
    return new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  }
  return 0;
}

function getReportRange(){
  if(reportPeriod==='custom'){
    const from = reportCustomFrom ? new Date(reportCustomFrom+'T00:00:00').getTime() : 0;
    const to = reportCustomTo ? new Date(reportCustomTo+'T23:59:59').getTime() : Date.now();
    return {start:from, end:to};
  }
  return {start:getPeriodStart(reportPeriod), end:Date.now()};
}

function computeTopProductsByRevenue(sinceTs, untilTs, limit){
  const until = untilTs===undefined ? Infinity : untilTs;
  const map = {};
  ORDERS.filter(o=>o.status==='done' && (o.doneAt||o.createdAt)>sinceTs && (o.doneAt||o.createdAt)<=until).forEach(o=>{
    (o.items||[]).forEach(it=>{
      if(!map[it.name]) map[it.name] = {qty:0, revenue:0};
      map[it.name].qty += it.qty;
      map[it.name].revenue += it.price*it.qty;
    });
  });
  return Object.entries(map).sort((a,b)=>b[1].revenue-a[1].revenue).slice(0, limit||5);
}

function computeTopCustomers(sinceTs, untilTs, limit){
  const until = untilTs===undefined ? Infinity : untilTs;
  const map = {};
  ORDERS.filter(o=>o.status==='done' && (o.doneAt||o.createdAt)>sinceTs && (o.doneAt||o.createdAt)<=until).forEach(o=>{
    const key = (o.phone && o.phone.trim()) || ('n:'+(o.customer||'-'));
    if(!map[key]) map[key] = {name:o.customer||'عميل بدون اسم', phone:o.phone||'', total:0, orders:0};
    map[key].total += (o.subtotal ?? (o.total-(o.deliveryFee||0)));
    map[key].orders += 1;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total).slice(0, limit||5);
}

function computeExpensesByCategory(sinceTs, untilTs){
  const until = untilTs===undefined ? Infinity : untilTs;
  const map = {};
  EXPENSES.filter(e=>(e.createdAt||0)>sinceTs && (e.createdAt||0)<=until).forEach(e=>{
    map[e.category] = (map[e.category]||0) + e.amount;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

const EXPENSE_CATEGORIES = ['ترويج وتسويق','إيجار','رواتب','فواتير وخدمات','صيانة','نقل وتوصيل','أخرى'];

function computeDeliveryByCompany(sinceTs, untilTs){
  const until = untilTs===undefined ? Infinity : untilTs;
  const doneOrders = ORDERS.filter(o=> o.status==='done' && (o.doneAt||o.createdAt) > sinceTs && (o.doneAt||o.createdAt) <= until);
  const map = {};
  doneOrders.forEach(o=>{
    if(!(o.deliveryFee>0)) return;
    const key = o.shippingCompanyName || 'بدون شركة محددة';
    if(!map[key]) map[key] = {amount:0, orders:0};
    map[key].amount += o.deliveryFee;
    map[key].orders += 1;
  });
  return Object.entries(map).sort((a,b)=>b[1].amount-a[1].amount);
}

function formatDate(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleDateString('en-GB');
}

// Revenue is recognized when an order is marked "done" (delivered & paid).
// COGS uses the wholesalePrice snapshotted on the order item at sale time,
// so later edits to a product's cost don't distort historical profit.
function computeStatsForData(ordersArr, expensesArr, sinceTs, untilTs){
  const until = (untilTs===undefined || untilTs===null) ? Infinity : untilTs;
  const doneOrders = ordersArr.filter(o=> o.status==='done' && (o.doneAt||o.createdAt) > sinceTs && (o.doneAt||o.createdAt) <= until);
  let revenueGoods=0, deliveryRevenue=0, cogs=0;
  doneOrders.forEach(o=>{
    deliveryRevenue += (o.deliveryFee||0);
    (o.items||[]).forEach(it=>{
      revenueGoods += it.price*it.qty;
      cogs += (it.wholesalePrice||0)*it.qty;
    });
  });
  const periodExpenses = expensesArr.filter(e=> (e.createdAt||0) > sinceTs && (e.createdAt||0) <= until);
  const expensesTotal = periodExpenses.reduce((s,e)=>s+e.amount,0);
  const totalRevenue = revenueGoods;
  const grossProfit = revenueGoods - cogs;
  const netProfit = grossProfit - expensesTotal;
  const marginPct = totalRevenue>0 ? (netProfit/totalRevenue*100) : 0;
  const avgOrderValue = doneOrders.length>0 ? totalRevenue/doneOrders.length : 0;
  const cancelledCount = ordersArr.filter(o=> o.status==='cancelled' && (o.createdAt||0) > sinceTs && (o.createdAt||0) <= until).length;
  return {ordersCount:doneOrders.length, revenueGoods, deliveryRevenue, totalRevenue, cogs, expensesTotal, grossProfit, netProfit, marginPct, avgOrderValue, cancelledCount};
}

function computeStatsSince(sinceTs, untilTs){
  return computeStatsForData(ORDERS, EXPENSES, sinceTs, untilTs);
}

let allSeasonsSummaryCache = null;

async function computeAllSeasonsSummary(){
  const perSeason = [];
  for(const s of SEASONS){
    const sk = (base)=> base + '::' + s.id;
    let orders=[], expenses=[], products=[], finance=null;
    try{ const o = await window.storage.get(sk('orders-list'), false); orders = o ? JSON.parse(o.value) : []; }catch(e){}
    try{ const ex = await window.storage.get(sk('expenses-list'), false); expenses = ex ? JSON.parse(ex.value) : []; }catch(e){}
    try{ const p = await window.storage.get(sk('products-list'), false); products = p ? JSON.parse(p.value) : []; }catch(e){}
    try{ const fc = await window.storage.get(sk('finance-config'), false); finance = fc ? JSON.parse(fc.value) : null; }catch(e){}
    const stats = computeStatsForData(orders, expenses, 0);
    const inventoryCapital = products.reduce((sum,p)=>sum+p.qty*(p.wholesalePrice||0),0);
    const capitalBalance = finance ? (finance.capitalBalance||0) : 0;
    const reserveBalance = finance ? (finance.reserveBalance||0) : 0;
    perSeason.push({season:s, stats, inventoryCapital, capitalBalance, reserveBalance});
  }
  const totals = perSeason.reduce((acc,r)=>{
    acc.ordersCount += r.stats.ordersCount;
    acc.totalRevenue += r.stats.totalRevenue;
    acc.cogs += r.stats.cogs;
    acc.expensesTotal += r.stats.expensesTotal;
    acc.netProfit += r.stats.netProfit;
    acc.inventoryCapital += r.inventoryCapital;
    acc.capitalBalance += r.capitalBalance;
    acc.reserveBalance += r.reserveBalance;
    return acc;
  }, {ordersCount:0,totalRevenue:0,cogs:0,expensesTotal:0,netProfit:0,inventoryCapital:0,capitalBalance:0,reserveBalance:0});
  return {perSeason, totals, computedAt:Date.now()};
}

function computeSettlementPreview(){
  const stats = computeStatsSince(FINANCE.lastSettlementAt || 0);
  const net = stats.netProfit;
  let reinvestAmount, ownerAmount, reserveAmount;
  if(net > 0){
    reinvestAmount = net * FINANCE.splitReinvestPct/100;
    ownerAmount = net * FINANCE.splitOwnerPct/100;
    reserveAmount = net - reinvestAmount - ownerAmount; // remainder absorbs rounding drift
  } else {
    // a loss period is absorbed entirely by capital; nothing to distribute
    reinvestAmount = net; ownerAmount = 0; reserveAmount = 0;
  }
  const partnerBreakdown = PARTNERS.map(p=>({
    partnerId:p.id, name:p.name, sharePct:p.sharePct, amount: ownerAmount * p.sharePct/100
  }));
  return {stats, reinvestAmount, ownerAmount, reserveAmount, partnerBreakdown};
}
